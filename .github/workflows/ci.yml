name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Backend runs strongo's Standard Go CI (lint · test · build) AND auto-tags the
  # next backend/vX.Y.Z on push to main (conventional-commit version bump).
  backend:
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      GH_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}
    with:
      working_directory: backend
      GOPRIVATE: github.com/sneat-co
      goprivate_git_host: github.com/sneat-co
      tag_prefix: backend/v

  frontend:
    uses: sneat-co/cicd/.github/workflows/nx-ci.yml@main
    with:
      working-directory: frontend
      targets: "lint test build"

  # E2E runs only after both backend and frontend succeed.
  e2e:
    needs: [backend, frontend]
    uses: sneat-co/cicd/.github/workflows/playwright-e2e.yml@main
    with:
      working-directory: frontend
      e2e-project-directory: frontend/apps/listus-app-e2e
