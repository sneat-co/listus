name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce backend dependency direction
        run: |
          if rg -n '"github\.com/sneat-co/sneat-go/|"github\.com/sneat-co/sneat-bots|"github\.com/bots-go-framework' backend --glob '*.go'; then
            echo 'Listus backend must not depend on the host or bot delivery packages.' >&2
            exit 1
          fi

  coverage:
    needs: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Enforce backend coverage floor (78.3%)
        working-directory: backend
        env:
          GOPRIVATE: github.com/sneat-co
        run: |
          go test -coverpkg=./... -coverprofile=coverage.out ./...
          coverage="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}' | tr -d '%')"
          awk -v coverage="$coverage" 'BEGIN { exit !(coverage + 0 >= 78.3) }' || {
            echo "coverage ${coverage}% is below the 78.3% floor" >&2
            exit 1
          }

  # Backend runs strongo's Standard Go CI (lint · test · build) AND auto-tags the
  # next backend/vX.Y.Z on push to main (conventional-commit version bump).
  backend:
    needs: [architecture, coverage]
    uses: strongo/cicd/.github/workflows/workflow.yml@main
    permissions:
      contents: write
    secrets:
      GH_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}
    with:
      working_directory: backend
      GOPRIVATE: github.com/sneat-co
      goprivate_git_host: github.com/sneat-co
      tag_prefix: backend/v

  frontend:
    uses: sneat-co/cicd/.github/workflows/nx-ci.yml@main
    with:
      working-directory: frontend
      targets: "lint test build"

  # E2E runs only after both backend and frontend succeed.
  e2e:
    needs: [backend, frontend]
    uses: sneat-co/cicd/.github/workflows/playwright-e2e.yml@main
    with:
      working-directory: frontend
      e2e-project-directory: frontend/apps/listus-app-e2e
