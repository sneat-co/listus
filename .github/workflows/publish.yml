name: Publish Listus packages

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - .github/workflows/publish.yml
  workflow_dispatch:
    inputs:
      dry_run:
        description: Dry run (resolves and prints the publish plan, does not actually publish)
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  publish:
    uses: sneat-co/cicd/.github/workflows/npm-publish.yml@main
    with:
      working-directory: frontend
      build-command: pnpm exec nx run-many -t build --projects=ext-listus-runtime,ext-listus-ui
      # main requires status checks, so the version-bump commit this produces
      # cannot be pushed directly (GH006). ../.github/scripts/publish-listus.sh
      # runs the idempotent Nx release and lands that commit on a plain
      # branch instead; the open-release-pr job below turns it into a pull
      # request with a token that actually triggers those checks.
      publish-command: ${{ inputs.dry_run && 'pnpm exec nx release --yes --dry-run' || '../.github/scripts/publish-listus.sh' }}
    secrets: inherit

  open-release-pr:
    needs: publish
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the release branch, if publish-listus.sh pushed one
        id: checkout
        uses: actions/checkout@v6
        continue-on-error: true
        with:
          ref: release/listus-${{ github.run_id }}
          fetch-depth: 1

      - name: Open the protected release pull request
        if: steps.checkout.outcome == 'success'
        env:
          # A pull request opened with the default GITHUB_TOKEN does not
          # trigger the required status checks it needs to satisfy branch
          # protection (GitHub deliberately suppresses workflow runs caused
          # by its own token). The org PAT does trigger them.
          GH_TOKEN: ${{ secrets.SNEAT_CI_READWRITE_TOKEN }}
        run: |
          set -euo pipefail
          branch="release/listus-${{ github.run_id }}"
          version="$(sed -n 's/^## \([0-9][0-9.]*\).*/\1/p' frontend/CHANGELOG.md | head -1)"
          gh pr create \
            --repo "${{ github.repository }}" \
            --base main \
            --head "${branch}" \
            --title "chore(release): publish listus ${version:-update}" \
            --body "Nx release computed and published the listus npm packages from this push. Main requires status checks, so the version-bump commit (package.json + CHANGELOG.md) lands via this PR instead of a direct push. Merging brings main in line with what is already published to npm."

      - name: No release branch to publish
        if: steps.checkout.outcome != 'success'
        run: echo "::notice::publish-listus.sh produced no release commit (nothing new to release); nothing to open a PR for."
