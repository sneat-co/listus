<ion-list>
  <!-- Space selector: switch between the user's spaces (like sneat-app). -->
  <ion-item class="sneat-pane-header">
    <sneat-space-selector
      [closeMenuOnSelection]="true"
      [navigateOnSelection]="false"
      justify="space-between"
      (spaceSelected)="switchSpace($event)"
    />
  </ion-item>

  <!-- Lists of the selected space. -->
  <ion-item
    button
    [routerLink]="spacePageUrl('lists')"
    routerDirection="root"
    [disabled]="$disabled()"
    (click)="closeMenu()"
  >
    <ion-icon name="list-outline" slot="start" />
    <ion-label>Lists</ion-label>
  </ion-item>

  @for (group of $listGroups(); track group.id; let groupIndex = $index) {
    @for (
      list of group.lists || [];
      track list.id;
      let listIndex = $index
    ) {
      <ion-item
        button
        class="ion-padding-start"
        [lines]="
          groupIndex + 1 === $listGroups().length &&
          listIndex + 1 === (group.lists || []).length
            ? 'none'
            : undefined
        "
        [routerLink]="spacePageUrl('list/' + list.type + '/' + list.id)"
        routerDirection="root"
        [disabled]="$disabled()"
        (click)="closeMenu()"
      >
        @if (list.emoji) {
          <ion-note slot="start">{{ list.emoji }}</ion-note>
        }
        <ion-label>{{ list.title || list.id }}</ion-label>
      </ion-item>
    }
  }

  <sneat-auth-menu-item />
</ion-list>
